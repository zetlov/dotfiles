name: CI

permissions:
  contents: read

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  lint:
    name: Lint shell scripts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4
        with:
          version: 2026.8.3
          sha256: 66585ac496c10bf6fbf13272e3e550c1813aed0e1cb780b9bb73c1751de49289
      - name: Run shellcheck
        run: mise run lint

  test:
    name: Test public repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4
        with:
          version: 2026.8.3
          sha256: 66585ac496c10bf6fbf13272e3e550c1813aed0e1cb780b9bb73c1751de49289
      - name: Install test tools
        run: sudo apt-get update && sudo apt-get install -y jq lua5.4 ripgrep stow zsh
      - name: Run repository tests
        run: mise run test
      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Validate configuration syntax
        run: |
          find stow -type f -name "*.lua" -print0 | xargs -0 -n1 luac -p
          find examples stow windows -type f -name "*.json" -print0 | xargs -0 -n1 jq empty

  windows:
    name: Test Windows configuration
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Run PowerShell tests
        shell: powershell
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module Pester -RequiredVersion 5.7.1 -Scope CurrentUser -Force
          Invoke-Pester -Path windows/kanata/tests,windows/komorebi/tests,windows/wezterm/tests,windows/glazewm/tests,windows/zebar/tests
      - name: Set up mise for Zebar
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4
        with:
          version: 2026.8.3
          sha256: 66585ac496c10bf6fbf13272e3e550c1813aed0e1cb780b9bb73c1751de49289
          working_directory: windows/zebar
          cache: false
      - name: Test and build Zebar
        working-directory: windows/zebar
        shell: powershell
        run: |
          npm ci
          mise run check
          git diff --exit-code -- dist

  arch:
    name: Test link-only install on Arch Linux (x86_64)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Run install.sh --link-only in archlinux container
        run: |
          docker run --rm \
            -v "${{ github.workspace }}":/work:ro \
            archlinux@sha256:5c0a4c06b4aca92db11a9db181461d9e412fbee3aa3561d318aec2df2f318769 \
            bash -eu -c '
              sed -i "/^\[options\]/a DisableSandbox" /etc/pacman.conf
              pacman -Syu --noconfirm --needed base-devel git stow sudo util-linux
              useradd -m -G wheel builder
              echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
              builder_home=$(getent passwd builder | cut -d: -f6)
              cp -a /work "${builder_home}/dotfiles"
              chown -R builder:builder "${builder_home}/dotfiles"
              sudo -u builder -H script -qefc "bash ${builder_home}/dotfiles/install.sh --link-only" /dev/null
            '

  alarm:
    name: Test link-only install on Arch Linux ARM (aarch64, emulated)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4
        with:
          platforms: linux/arm64
          image: tonistiigi/binfmt@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
      - name: Run install.sh --link-only in archlinuxarm container
        run: |
          docker run --rm --platform linux/arm64 \
            -v "${{ github.workspace }}":/work:ro \
            menci/archlinuxarm@sha256:bd173cb4db756109cd20213678f0aca01242c95ab7ee3b644e92a92527ab1e04 \
            bash -eu -c '
              sed -i "/^\[options\]/a DisableSandbox" /etc/pacman.conf
              pacman -Syu --noconfirm --needed base-devel git stow sudo util-linux
              useradd -m -G wheel builder
              echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
              builder_home=$(getent passwd builder | cut -d: -f6)
              cp -a /work "${builder_home}/dotfiles"
              chown -R builder:builder "${builder_home}/dotfiles"
              sudo -u builder -H script -qefc "bash ${builder_home}/dotfiles/install.sh --link-only" /dev/null
            '
