# Herdr runs inside WezTerm on WSL and manages its own workspaces and tabs.
onboarding = false

[theme]
name = "tokyo-night"
auto_switch = true
dark_name = "tokyo-night"
light_name = "tokyo-night-day"

[terminal]
default_shell = "zsh"
shell_mode = "non_login"
new_cwd = "follow"

[worktrees]
directory = "~/.worktrees"

[session]
resume_agents_on_restore = true

[update]
channel = "stable"

[ui]
hide_tab_bar_when_single_tab = true
tab_bar_position = "bottom"
status_indicators = "symbols"
show_agent_labels_on_pane_borders = true
tab_bar_right = [
    { type = "hostname" },
    { type = "datetime", format = "%H:%M" },
]

[ui.sidebar.agents]
row_gap = 0
rows = [
    ["state_icon", "agent", "$role", "$model"],
    ["$task"],
    ["workspace", "tab"],
]

[ui.sidebar.spaces]
row_gap = 0
rows = [
    ["state_icon", "workspace"],
    ["branch", "git_status"],
]

[ui.toast]
delivery = "terminal"
delay_seconds = 1

[keys]
prefix = "ctrl+b"

# pane
focus_pane_left = "prefix+h"
focus_pane_down = "prefix+j"
focus_pane_up = "prefix+k"
focus_pane_right = "prefix+l"

# tab
new_tab = "prefix+c"
next_tab = "prefix+n"
previous_tab = "prefix+p"

# workspace / agent navigation
goto = "prefix+g"

[[keys.command]]
key = "prefix+alt+g"
type = "pane"
command = "lazygit"

[[keys.command]]
key = "prefix+f"
type = "pane"
command = "fzf"
