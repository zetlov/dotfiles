# ~/.config/hypr/hyprlock.conf

# hyprlang noerror true
source = ~/.local/state/zetshell/hyprlock-colors.conf
# hyprlang noerror false

general {
    no_fade_in = false
    grace = 0
    disable_loading_bar = true
}

# 背景の設定
background {
    monitor =
    path = ~/.local/state/zetshell/current-wallpaper
    color = $lock_background

    # ブラー（ぼかし）エフェクト
    blur_passes = 2 # 0にすると無効
    blur_size = 7
}

# 入力フィールド（パスワードを入れるところ）
input-field {
    monitor =
    size = 200, 50
    outline_thickness = 3
    dots_size = 0.33
    dots_spacing = 0.15
    dots_center = true
    outer_color = $lock_input_outer
    inner_color = $lock_input_inner
    font_color = $lock_input_font
    fade_on_empty = true
    placeholder_text = <i>Input Password...</i>
    hide_input = false

    position = 0, -20
    halign = center
    valign = center
}

# ラベル（時計とか）
label {
    monitor =
    text = cmd[update:1000] echo "$TIME"
    color = $lock_label
    font_size = 64
    font_family = Noto Sans

    position = 0, 80
    halign = center
    valign = center
}
