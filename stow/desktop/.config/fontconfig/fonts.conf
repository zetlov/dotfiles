<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!--
    JetBrainsMono Nerd Font stays the primary family. binding="strong" is
    required so it wins as the primary even under a Japanese locale (a weak
    alias loses to Noto Sans CJK JP, which covers lang=ja and would otherwise
    become the default).

    The fix for "icons sometimes missing": give each generic a full fallback
    chain so per-glyph fallback always resolves symbols, CJK and emoji -
      Nerd Font -> Symbols Nerd Font -> Noto * CJK JP -> Noto Color Emoji
      -> Noto Sans Symbols / Symbols 2
    The old config listed no emoji/symbol font (emoji fell back to a fragile
    last-resort match) and added a lang=ja strong "prepend" that forced
    Noto Sans CJK JP ahead of everything on Japanese pages, stealing symbol
    codepoints such as U+25B6. Han already renders in the JP variant because
    Noto * CJK JP is the only CJK family in each list, so that rule is gone.
  -->

  <!-- sans-serif -->
  <alias binding="strong">
    <family>sans-serif</family>
    <prefer>
      <family>JetBrainsMono Nerd Font</family>
      <family>Symbols Nerd Font</family>
      <family>Noto Sans CJK JP</family>
      <family>Noto Color Emoji</family>
      <family>Noto Sans Symbols</family>
      <family>Noto Sans Symbols 2</family>
    </prefer>
  </alias>

  <!-- serif -->
  <alias binding="strong">
    <family>serif</family>
    <prefer>
      <family>JetBrainsMono Nerd Font</family>
      <family>Symbols Nerd Font</family>
      <family>Noto Serif CJK JP</family>
      <family>Noto Color Emoji</family>
      <family>Noto Sans Symbols</family>
      <family>Noto Sans Symbols 2</family>
    </prefer>
  </alias>

  <!-- monospace -->
  <alias binding="strong">
    <family>monospace</family>
    <prefer>
      <family>JetBrainsMono Nerd Font</family>
      <family>Symbols Nerd Font</family>
      <family>Noto Sans Mono CJK JP</family>
      <family>Noto Color Emoji</family>
      <family>Noto Sans Symbols</family>
      <family>Noto Sans Symbols 2</family>
    </prefer>
  </alias>
</fontconfig>
