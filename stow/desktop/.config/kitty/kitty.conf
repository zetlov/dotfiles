include ./mocha.conf
include ~/.local/state/zetshell/kitty-theme.conf
font_family      family='JetBrainsMono Nerd Font' postscript_name=JetBrainsMonoNF-Regular
font_size        13
bold_font        auto
italic_font      auto
bold_italic_font auto

mouse_hide_wait  2.0
cursor_shape     block

background_opacity 0.7

confirm_os_window_close 0
# Wayland (Hyprland) 側でタイトルバーなどを制御させるための設定
linux_display_server wayland
