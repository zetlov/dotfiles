[tools]
gitleaks = "8.27.0"
python = "3.13.7"
shellcheck = "0.10.0"

[tasks.test]
description = "Run repository shell tests"
run = '''
for test_file in scripts/tests/*.test.sh; do
  "$test_file"
done
'''

[tasks.lint]
description = "Lint shell scripts"
run = '''
git ls-files -z -- '*.sh' | xargs -0 -r shellcheck --severity=error
'''

[tasks."check:configs"]
description = "Validate tracked Lua and JSON configuration syntax"
tools.lua = "5.4.8"
run = '''
git ls-files -z -- '*.lua' | xargs -0 -r -n1 luac -p
git ls-files -z -- '*.json' | xargs -0 -r -n1 jq empty
'''

[tasks."check:zebar"]
description = "Run Zebar tests, type checks, and build"
dir = "windows/zebar"
run = '''
npm ci
mise run check
git diff --exit-code -- dist
'''

[tasks."check:windows"]
description = "Run Windows tests with PowerShell 7"
run = "pwsh.exe -NoProfile -ExecutionPolicy Bypass -File windows/tests/Invoke-PesterSuite.ps1"

[tasks."check:windows-compat"]
description = "Run Windows compatibility tests with Windows PowerShell 5.1"
run = "powershell.exe -NoProfile -ExecutionPolicy Bypass -File windows/tests/Invoke-PesterSuite.ps1"

[tasks.security]
description = "Check the public boundary and scan the working tree for secrets"
run = '''
scripts/security/check-public-tree.sh
gitleaks dir --no-banner --redact --exit-code 1 .
'''

[tasks."check:fast"]
description = "Run portable tests, lint, config validation, and security checks"
depends = ["test", "lint", "check:configs", "security"]

[tasks.check]
description = "Run the default portable repository checks"
depends = ["check:fast"]

[tasks."check:all-local"]
description = "Run every portable, Zebar, and Windows source verification task"
depends = [
  "check:fast",
  "check:zebar",
  "check:windows",
  "check:windows-compat",
]
